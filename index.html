<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resaka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="setup" hidden>
    <label>Server <input id="setup-server" placeholder="wss://…/ws"></label>
    <label>Code / Kaody <input id="setup-code"></label>
    <button id="setup-go">OK</button>
    <p id="setup-error"></p>
  </div>
  <div id="app" hidden>
    <header>
      <span id="status-dot"></span>
      <span id="status-text"></span>
      <span id="partner"></span>
    </header>
    <div id="banner" hidden></div>
    <div id="settings" hidden>
      <label>LLM <select id="provider"></select></label>
      <span id="provider-status"></span>
      <label>Modus
        <select id="mode">
          <option value="chunked">Live (Chunks)</option>
          <option value="whole_turn">Ganzer Beitrag</option>
        </select>
      </label>
      <label>Fixture <select id="fixture"></select></label>
      <button id="play">▶</button>
      <button id="sound"></button>
      <span id="asr-status"></span>
    </div>
    <main id="chat"></main>
    <footer id="debug" hidden>
      <textarea id="sim-text" rows="2"></textarea>
      <button id="sim-go"></button>
    </footer>
    <div id="talkbar"><button id="talk" disabled></button></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
